name: Build web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create web platform files
        run: flutter create --platforms=web --project-name tajbozor .

      - run: flutter pub get

      - name: Build web
        run: flutter build web --release --pwa-strategy=none

      - name: Add security headers for Cloudflare Pages
        run: |
          cat > build/web/_headers <<'EOF'
          /*
            X-Frame-Options: SAMEORIGIN
            X-Content-Type-Options: nosniff
            Referrer-Policy: strict-origin-when-cross-origin
            Strict-Transport-Security: max-age=31536000; includeSubDomains
            Permissions-Policy: payment=(), usb=()
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: tajbozor-web
          path: build/web

      - name: Publish built site to the site branch
        run: |
          cd build/web
          git init -q -b site
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "Build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site
