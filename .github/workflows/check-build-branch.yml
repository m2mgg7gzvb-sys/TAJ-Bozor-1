name: Check build (feature branch)

# Только проверяет сборку ветки, ничего не публикует на сайт.
on:
  push:
    branches: [chat-voice-files, fix/category-header-scroll, feature/car-filter-two-rows, feature/auto-subcategory-tiles, fix/auto-tiles-size, fix/auto-tiles-layout, fix/auto-tiles-compact, feature/auto-filter-chips, fix/subcat-order, feature/subcat-open-screen, feature/car-filters-full, feature/car-form-fields, feature/car-pick-engine-color, feature/car-filter-page, fix/map-city-center, feature/form-required-highlight, feature/car-sort, fix/chips-reload, feature/picker-sheets-style, feature/moto-catalog, feature/chat-tajik-time, feature/category-3d-icons, feature/all-categories-icons, feature/all-categories-listings, feature/all-categories-compact, feature/all-categories-no-button, feature/call-options, feature/agora-calls, feature/call-error-detail, feature/call-ringtone-timer, feature/agora-sdk-load, feature/incoming-calls, feature/call-push-style, feature/call-from-notifications, feature/call-simultaneous, feature/call-push-open, feature/privacy-policy]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create web platform files
        run: flutter create --platforms=web --project-name tajbozor .

      - run: flutter pub get

      - name: Build web (check only)
        run: flutter build web --release --pwa-strategy=none
