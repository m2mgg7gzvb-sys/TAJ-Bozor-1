name: Check build (feature branch)

# Только проверяет сборку ветки, ничего не публикует на сайт.
on:
  push:
    branches: [chat-voice-files, fix/category-header-scroll, feature/car-filter-two-rows, feature/auto-subcategory-tiles, fix/auto-tiles-size, fix/auto-tiles-layout, fix/auto-tiles-compact, feature/auto-filter-chips, fix/subcat-order, feature/subcat-open-screen, feature/car-filters-full, feature/car-form-fields, feature/car-pick-engine-color, feature/car-filter-page, fix/map-city-center, feature/form-required-highlight, feature/car-sort, fix/chips-reload, feature/picker-sheets-style]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create web platform files
        run: flutter create --platforms=web --project-name tajbozor .

      - run: flutter pub get

      - name: Build web (check only)
        run: flutter build web --release --pwa-strategy=none
