name: Build Android (AAB)

on:
  workflow_dispatch:
  push:
    branches: [feature/android-build]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android platform files
        run: flutter create --platforms=android --project-name tajbozor --org tj.tajbozor .

      - name: Set application id and app name
        run: |
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            [ -f "$f" ] && sed -i -E 's/applicationId[ =]+"[^"]*"/applicationId = "tj.tajbozor.app"/; s/namespace[ =]+"[^"]*"/namespace = "tj.tajbozor.app"/' "$f"
          done
          sed -i -E 's/android:label="[^"]*"/android:label="TAJ Bozor"/' android/app/src/main/AndroidManifest.xml

      - name: Add permissions
        run: python3 .github/scripts/add_permissions.py

      - name: Prepare keystore and signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keys/upload.jks"
          python3 .github/scripts/configure_signing.py

      - run: flutter pub get

      - name: Build AAB
        run: flutter build appbundle --release
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/keys/upload.jks
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - uses: actions/upload-artifact@v4
        with:
          name: tajbozor-aab
          path: build/app/outputs/bundle/release/app-release.aab
