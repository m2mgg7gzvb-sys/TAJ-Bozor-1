name: Build Android APK

# Запускается вручную: Actions → Build Android APK → Run workflow.
# Готовый подписанный APK лежит в разделе Artifacts запуска (app-release-signed).
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Создать Android-проект (папка android появится в сборке)
        run: |
          flutter pub get
          flutter create --platforms=android --org com.tajbozor --project-name tajbozor .

      - name: Настроить ID приложения, название и разрешения
        run: |
          python3 - <<'PY'
          import re, pathlib
          gradle = list(pathlib.Path('android/app').glob('build.gradle*'))[0]
          text = gradle.read_text(encoding='utf-8')
          text = re.sub(r'applicationId\s*=?\s*"[^"]*"', 'applicationId = "com.tajbozor.app"', text)
          gradle.write_text(text, encoding='utf-8')

          manifest = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          m = manifest.read_text(encoding='utf-8')
          m = re.sub(r'android:label="[^"]*"', 'android:label="TAJ Bozor"', m, count=1)
          perms = [
              'android.permission.INTERNET',
              'android.permission.RECORD_AUDIO',
              'android.permission.CAMERA',
              'android.permission.ACCESS_FINE_LOCATION',
              'android.permission.ACCESS_COARSE_LOCATION',
              'android.permission.READ_MEDIA_IMAGES',
              'android.permission.READ_MEDIA_VIDEO',
              'android.permission.READ_EXTERNAL_STORAGE',
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.VIBRATE',
          ]
          add = ''.join(f'    <uses-permission android:name="{p}"/>\n' for p in perms if p not in m)
          m = m.replace('<application', add + '    <application', 1)
          # Android 11+: чтобы открывать Telegram и WhatsApp напрямую
          queries = (
              '    <queries>\n'
              '        <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="tg"/></intent>\n'
              '        <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="whatsapp"/></intent>\n'
              '        <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent>\n'
              '    </queries>\n'
          )
          if '<queries>' not in m:
              m = m.replace('</manifest>', queries + '</manifest>', 1)
          manifest.write_text(m, encoding='utf-8')
          PY

      - name: Поднять compileSdk до 36 и отключить lint (нужно плагинам)
        run: |
          python3 - <<'PY'
          import pathlib
          root = list(pathlib.Path('android').glob('build.gradle*'))[0]
          text = root.read_text(encoding='utf-8')
          if root.suffix == '.kts':
              block = (
                  'subprojects {\n'
                  '    afterEvaluate {\n'
                  '        extensions.findByName("android")?.let { ext ->\n'
                  '            ext.javaClass.methods.first { it.name == "setCompileSdk" && it.parameterCount == 1 }.invoke(ext, 36)\n'
                  '        }\n'
                  '    }\n'
                  '}\n'
              )
          else:
              block = (
                  'subprojects {\n'
                  '    afterEvaluate { p ->\n'
                  '        if (p.hasProperty("android")) {\n'
                  '            p.android.compileSdkVersion 36\n'
                  '        }\n'
                  '    }\n'
                  '}\n'
              )
          lint_off = (
              'allprojects {\n'
              '    tasks.configureEach {\n'
              '        if (name.startsWith("lint")) enabled = false\n'
              '    }\n'
              '}\n'
          ) if root.suffix == '.kts' else (
              'allprojects {\n'
              '    tasks.configureEach {\n'
              '        if (name.startsWith("lint")) { enabled = false }\n'
              '    }\n'
              '}\n'
          )
          root.write_text(lint_off + block + text, encoding='utf-8')
          PY

      - name: Собрать release APK
        run: |
          # versionCode должен расти с каждой сборкой (RuStore отклоняет меньший или равный).
          # Берём минуты с 1970 года: всегда больше предыдущих и меньше лимита Android.
          BUILD_NUMBER=$(( $(date +%s) / 60 ))
          flutter build apk --release --build-number=$BUILD_NUMBER

      - name: Подписать ключом TAJ Bozor
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/upload.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEYSTORE_PASSWORD" \
            --out "$RUNNER_TEMP/app-release-signed.apk" \
            "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify "$RUNNER_TEMP/app-release-signed.apk"
          cp "$RUNNER_TEMP/app-release-signed.apk" build/app-release-signed.apk

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: build/app-release-signed.apk
