name: tajbozor
description: TAJBozor — объявления Таджикистана
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0
  flutter_svg: ^2.0.10
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2
  share_plus: ^10.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.svg
    - assets/photos/
    - assets/generations/
