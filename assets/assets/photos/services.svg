<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="{{bg1}}"/>
      <stop offset="1" stop-color="{{bg2}}"/>
    </linearGradient>
    <linearGradient id="tool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="{{a}}"/>
      <stop offset="1" stop-color="{{b}}"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="150" fill="#FFFFFF" opacity="0.3"/>
  <circle cx="200" cy="200" r="104" fill="#FFFFFF" opacity="0.28"/>
  <g transform="rotate(-42 200 200)">
    <rect x="189" y="96" width="22" height="232" rx="9" fill="#B9803F"/>
    <rect x="146" y="84" width="108" height="44" rx="9" fill="#55626C"/>
    <rect x="146" y="84" width="108" height="12" rx="6" fill="#FFFFFF" opacity="0.25"/>
  </g>
  <g transform="rotate(42 200 200)">
    <rect x="189" y="150" width="22" height="180" rx="9" fill="url(#tool)"/>
    <circle cx="200" cy="130" r="44" fill="url(#tool)"/>
    <rect x="186" y="72" width="28" height="48" fill="{{bg1}}"/>
    <circle cx="200" cy="130" r="14" fill="{{bg2}}" opacity="0.7"/>
  </g>
</svg>
